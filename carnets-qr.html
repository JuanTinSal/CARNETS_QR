<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendario emergente</title>
  <style>
    :root {
      --navy: #1f3864;
      --navy-soft: #eef2f8;
      --green: #2f9e57;
      --green-dark: #1e7d45;
      --line: #dfe6ee;
      --bg: #f4f7fb;
      --text: #1d2a39;
      --muted: #6d7785;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #eef3f8, #edf2f7 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .demo-wrap {
      width: 100%;
      max-width: 540px;
      padding: 32px 20px;
    }

    .date-input {
      width: 100%;
      max-width: 240px;
      border: 2px solid var(--green);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 22px;
      text-align: center;
      background: #f4fbf7;
      color: var(--navy);
      font-weight: 600;
      letter-spacing: 0.04em;
      box-shadow: inset 0 0 0 1px rgba(47,158,87,.15);
      cursor: pointer;
    }

    .date-input:focus {
      outline: none;
      box-shadow: 0 0 0 4px rgba(47,158,87,.15);
    }

    .date-popover {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(92vw, 340px);
      background: white;
      border: 2px solid var(--green);
      border-radius: 12px;
      box-shadow: 0 20px 45px rgba(0,0,0,.18);
      display: none;
      z-index: 9999;
      overflow: hidden;
    }

    .date-popover.open { display: block; }

    .date-popover-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px 10px;
      background: #f5faf7;
      border-bottom: 1px solid var(--line);
      font-size: 18px;
      font-weight: 700;
      color: var(--navy);
    }

    .date-popover-nav {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .date-popover-nav button {
      border: none;
      background: transparent;
      font-size: 22px;
      color: var(--navy);
      cursor: pointer;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      line-height: 1;
    }

    .date-popover-nav button:hover {
      background: var(--navy-soft);
    }

    .date-popover-body {
      padding: 12px 16px 16px;
    }

    .weekdays, .days-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .weekdays {
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      font-weight: 700;
    }

    .days-grid {
      text-align: center;
    }

    .day {
      border: none;
      background: #edf4ff;
      color: var(--navy);
      border-radius: 8px;
      height: 36px;
      font-size: 16px;
      cursor: pointer;
      transition: all .12s ease;
    }

    .day:hover {
      background: #dfeaff;
    }

    .day.empty {
      background: transparent;
      cursor: default;
      visibility: hidden;
      pointer-events: none;
    }

    .day.selected {
      background: var(--green);
      color: white;
      font-weight: 700;
      box-shadow: 0 0 0 2px rgba(47,158,87,.15);
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <input id="fechaInput" class="date-input" type="text" value="25/09/2026" aria-label="Fecha" readonly />
  </div>

  <div id="datePopover" class="date-popover" aria-hidden="true">
    <div class="date-popover-header">
      <span id="monthLabel">Septiembre 2026</span>
      <div class="date-popover-nav">
        <button type="button" id="prevMonth" aria-label="Mes anterior">&#8592;</button>
        <button type="button" id="nextMonth" aria-label="Mes siguiente">&#8594;</button>
      </div>
    </div>
    <div class="date-popover-body">
      <div class="weekdays">
        <div>D</div>
        <div>L</div>
        <div>M</div>
        <div>X</div>
        <div>J</div>
        <div>V</div>
        <div>S</div>
      </div>
      <div id="daysGrid" class="days-grid"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'carnets_qr_fecha';
    const fechaInput = document.getElementById('fechaInput');
    const datePopover = document.getElementById('datePopover');
    const monthLabel = document.getElementById('monthLabel');
    const daysGrid = document.getElementById('daysGrid');
    const prevMonthBtn = document.getElementById('prevMonth');
    const nextMonthBtn = document.getElementById('nextMonth');

    let calendarDate = new Date();
    let activeInput = null;

    function pad2(n) {
      return String(n).padStart(2, '0');
    }

    function normalizeDateString(value) {
      const match = /^\d{1,2}\/\d{1,2}\/\d{4}$/.exec(value || '');
      if (!match) return null;
      const [dd, mm, yyyy] = value.split('/');
      const d = new Date(Number(yyyy), Number(mm) - 1, Number(dd));
      if (isNaN(d.getTime())) return null;
      return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`;
    }

    function formatDate(date) {
      return `${pad2(date.getDate())}/${pad2(date.getMonth() + 1)}/${date.getFullYear()}`;
    }

    function saveDate(value) {
      try {
        localStorage.setItem(STORAGE_KEY, value);
      } catch (e) {
        console.warn('No se pudo guardar la fecha en localStorage:', e);
      }
    }

    function openCalendar(input) {
      activeInput = input || fechaInput;
      const currentValue = normalizeDateString(activeInput.value);
      if (currentValue) {
        const [dd, mm, yyyy] = currentValue.split('/');
        calendarDate = new Date(Number(yyyy), Number(mm) - 1, Number(dd));
      } else {
        calendarDate = new Date();
      }
      renderCalendar();
      datePopover.classList.add('open');
      datePopover.setAttribute('aria-hidden', 'false');
    }

    function closeCalendar() {
      datePopover.classList.remove('open');
      datePopover.setAttribute('aria-hidden', 'true');
      activeInput = null;
    }

    function renderCalendar() {
      const y = calendarDate.getFullYear();
      const m = calendarDate.getMonth();
      monthLabel.textContent = new Intl.DateTimeFormat('es-ES', {
        month: 'long',
        year: 'numeric'
      }).format(new Date(y, m, 1));

      const firstDay = new Date(y, m, 1);
      const lastDay = new Date(y, m + 1, 0);
      const startWeekday = firstDay.getDay();
      const leadingEmpty = (startWeekday === 0 ? 6 : startWeekday - 1);
      const totalDays = lastDay.getDate();

      daysGrid.innerHTML = '';

      for (let i = 0; i < leadingEmpty; i++) {
        const empty = document.createElement('div');
        empty.className = 'day empty';
        daysGrid.appendChild(empty);
      }

      for (let day = 1; day <= totalDays; day++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'day';
        btn.textContent = String(day);

        const candidate = new Date(y, m, day);
        const selected = activeInput && normalizeDateString(activeInput.value) === formatDate(candidate);
        if (selected) btn.classList.add('selected');

        btn.addEventListener('click', () => {
          activeInput.value = formatDate(candidate);
          saveDate(activeInput.value);
          closeCalendar();
        });

        daysGrid.appendChild(btn);
      }
    }

    fechaInput.addEventListener('dblclick', () => openCalendar(fechaInput));
    fechaInput.addEventListener('focus', () => openCalendar(fechaInput));

    prevMonthBtn.addEventListener('click', () => {
      calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() - 1, 1);
      renderCalendar();
    });

    nextMonthBtn.addEventListener('click', () => {
      calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() + 1, 1);
      renderCalendar();
    });

    document.addEventListener('click', (e) => {
      const clickedInput = e.target.closest('#fechaInput');
      const clickedPopover = e.target.closest('#datePopover');
      if (!clickedInput && !clickedPopover) closeCalendar();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeCalendar();
    });

    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored && normalizeDateString(stored)) {
      fechaInput.value = normalizeDateString(stored);
    }

    renderCalendar();
    openCalendar(fechaInput);
    closeCalendar();
  </script>
</body>
</html>
